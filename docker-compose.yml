services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://api_security:change-me-locally@db:5432/api_security
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: api_security
      POSTGRES_USER: api_security
      POSTGRES_PASSWORD: change-me-locally
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_security -d api_security"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
